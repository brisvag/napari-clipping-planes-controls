name: napari-clipping-planes-controls
display_name: Clipping Planes Controls
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: [Utilities, Visualization]
contributions:
  commands:
    - id: napari-clipping-planes-controls.side_view_widget
      title: Side view controls for clipping planes
      python_name: napari_clipping_planes_controls.controls_widget:ClippingPlanesSideViewControls
    - id: napari-clipping-planes-controls.slider_widget
      title: Slider controls for clipping planes
      python_name: napari_clipping_planes_controls.controls_widget:ClippingPlanesSliderControls
  widgets:
    - command: napari-clipping-planes-controls.side_view_widget
      display_name: Clipping planes side view controls
    - command: napari-clipping-planes-controls.slider_widget
      display_name: Clipping planes slider controls
  menus:
    napari/layers/visualize:
      - command: napari-clipping-planes-controls.side_view_widget
      - command: napari-clipping-planes-controls.slider_widget
